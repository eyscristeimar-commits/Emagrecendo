name: Diagnostico
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - run: |
          q() { jq -n --arg q "$1" '{query:$q}' | curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d @- ; echo; }
          echo "== usuarios"; q "select u.created_at, split_part(u.email,'@',2) dominio, u.email_confirmed_at is not null confirmado, u.last_sign_in_at, u.recovery_sent_at, (select count(*) from public.profile_owners o where o.uid=u.id) perfis from auth.users u order by created_at"
          echo "== eventos"; q "select created_at, payload->>'action' acao from auth.audit_log_entries order by created_at desc limit 25"
          echo "== config"; curl -sS "https://api.supabase.com/v1/projects/$REF/config/auth" -H "Authorization: Bearer $T" | jq '{smtp_host, rate_limit_email_sent, mailer_autoconfirm, site_url, uri_allow_list}'
